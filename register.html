{% extends 'base.html' %}
{% block content %}
<div style="background: white; padding: 38px; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); border: 1px solid #e8eaf0; max-width: 480px; margin: 40px auto;">
    <div style="text-align:center; margin-bottom:24px;">
        <div style="width:52px;height:52px;background:linear-gradient(135deg,#8a1131,#6b0c24);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 12px;">🍷</div>
        <h2 style="color:#1e293b; margin:0; font-size:21px; font-weight:800;">Create Account</h2>
        <p style="color:#64748b; font-size:13px; margin-top:5px;">Join the FoodExpress network</p>
    </div>
    
    <form action="/register" method="POST">
        <div style="margin-bottom: 12px;">
            <label style="display:block; margin-bottom:5px; font-weight:600;">Full Name:</label>
            <input type="text" name="name" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;">
        </div>
        <div style="margin-bottom: 12px;">
            <label style="display:block; margin-bottom:5px; font-weight:600;">Unique Username Node:</label>
            <input type="text" name="username" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;">
        </div>
        <div style="margin-bottom: 12px;">
            <label style="display:block; margin-bottom:5px; font-weight:600;">Secure Password:</label>
            <input type="password" name="password" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;">
        </div>
        <div style="margin-bottom: 12px;">
            <label style="display:block; margin-bottom:5px; font-weight:600;">Contact Number:</label>
            <input type="text" name="contact" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;">
        </div>
        <div style="margin-bottom: 12px;">
            <label style="display:block; margin-bottom:5px; font-weight:600;">Email Address:</label>
            <input type="email" name="email" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;">
        </div>
        <div style="margin-bottom: 12px;">
            <label style="display:block; margin-bottom:5px; font-weight:600;">Physical Home Address Details:</label>
            <textarea name="address" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px; height:80px;"></textarea>
        </div>
        <div style="margin-bottom: 12px;">
            <label style="display:block; margin-bottom:5px; font-weight:600;">User Age Metrics:</label>
            <input type="number" name="age" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;">
        </div>
        <div style="margin-bottom: 20px;">
            <label style="display:block; margin-bottom:5px; font-weight:600;">Assign Role Vector:</label>
            <select name="role" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;">
                <option value="customer">Customer (Foodie)</option>
                <option value="delivery_partner">Delivery Partner (Rider)</option>
            </select>
        </div>
        <button type="submit" style="width:100%; padding:14px; background:linear-gradient(135deg,#8a1131,#6b0c24); color:#ffffff; border:none; font-weight:700; border-radius:8px; cursor:pointer; font-size:15px; letter-spacing:0.3px;">Create Account 🚀</button>
    </form>
</div>
{% endblock %}
